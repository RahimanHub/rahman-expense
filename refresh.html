<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rahman Expense — Refresh v2.9</title></head>
<body style="font-family:system-ui;padding:28px;line-height:1.5"><h2>Updating Rahman Expense…</h2><p>This clears only old app cache. Your expense data is not deleted.</p>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.unregister()));}
    if('caches' in window){const keys=await caches.keys(); await Promise.all(keys.filter(k=>k.startsWith('rahman-expense-')).map(k=>caches.delete(k)));}
  }catch(e){}
  location.replace('./?v=2.9&fresh='+Date.now());
})();
</script></body></html>
